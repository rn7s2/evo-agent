name: CI

# Two things this guards:
#   - pull_request: actions/checkout defaults to the PR's test-merge commit
#     (head merged into base), so this exercises the PR *as merged with
#     main*, not just the branch in isolation.
#   - push to main: catches anything that only breaks once a PR actually
#     lands (e.g. two PRs that are each fine alone but conflict in effect).
#
# Matrix covers both implementations evo builds on (design.md D10): SBCL and
# ECL each get their own portability surface in evo.port, and either can
# regress independently of the other.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lisp: [sbcl, ecl]
    steps:
      - uses: actions/checkout@v7

      - name: Install ${{ matrix.lisp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.lisp }}

      - name: Cache Quicklisp
        id: cache-quicklisp
        uses: actions/cache@v6
        with:
          path: |
            ~/quicklisp
            ~/.cache/common-lisp
          key: quicklisp-${{ runner.os }}-${{ matrix.lisp }}-${{ hashFiles('evo.asd') }}
          restore-keys: |
            quicklisp-${{ runner.os }}-${{ matrix.lisp }}-

      # Gate on the filesystem, not on cache-hit.  The cache key hashes
      # evo.asd, so any PR that touches the system definition misses the exact
      # key -- but restore-keys still restores ~/quicklisp from the prefix
      # match, and quicklisp-quickstart:install ERRORS on an existing install
      # ("Quicklisp has already been installed").  Keying the skip on what is
      # actually on disk is right whichever way the cache resolved.
      - name: Bootstrap Quicklisp
        run: |
          if [ -f ~/quicklisp/setup.lisp ]; then
            echo "Quicklisp restored from cache; skipping install."
            exit 0
          fi
          curl -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          if [ "${{ matrix.lisp }}" = ecl ]; then
            ecl -q --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install)' \
              --eval '(ext:quit 0)' < /dev/null
          else
            sbcl --non-interactive --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install)'
          fi

      - name: Wire Quicklisp into Lisp init file
        run: |
          initfile=~/.sbclrc
          [ "${{ matrix.lisp }}" = ecl ] && initfile=~/.eclrc
          cat > "$initfile" <<'EOF'
          #-quicklisp
          (let ((quicklisp-init (merge-pathnames "quicklisp/setup.lisp"
                                                  (user-homedir-pathname))))
            (when (probe-file quicklisp-init)
              (load quicklisp-init)))
          EOF

      - name: Pre-fetch dependencies
        run: |
          if [ "${{ matrix.lisp }}" = ecl ]; then
            ecl -q --eval '(push (uiop:getcwd) asdf:*central-registry*)' \
              --eval '(ql:quickload :evo)' \
              --eval '(ext:quit 0)' < /dev/null
          else
            sbcl --non-interactive \
              --eval '(push (uiop:getcwd) asdf:*central-registry*)' \
              --eval '(ql:quickload :evo)'
          fi

      - name: make build
        run: make build LISP=${{ matrix.lisp }}

      - name: make test
        run: make test LISP=${{ matrix.lisp }}

  # Windows is SBCL-only (src/port/port.lisp: the ECL branches are Unix
  # facilities with no Windows twin).  It builds, runs the portable unit suite
  # and smoke-tests the artifact — the same guard the Unix job gives, now that
  # the unit suite passes on Windows (876/0) instead of being taken on faith.
  # What stays out, by decision not omission: the live console-test, which
  # drives a real interactive console (CONIN$/CONOUT$ key injection and
  # screen-buffer readback) a redirected CI runner does not have; and the .exp
  # suites, which need a pty.  So this job guards that every #+/#- branch in the
  # port layer still READS and COMPILES on Windows, that the unit suite is
  # green, and that the artifact is a runnable evo.exe.
  build-and-test-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Chocolatey's SBCL is an installer, not a shimmed package: it puts
      # sbcl.exe somewhere the *machine* PATH knows about, and the runner
      # process does not re-read that mid-job.  So find it and publish the
      # directory (plus SBCL_HOME, which is how the runtime finds its core
      # and contribs) through the files GitHub does re-read between steps.
      - name: Install SBCL
        shell: pwsh
        run: |
          choco install sbcl --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sbclHome = @(
            "$env:ProgramFiles\Steel Bank Common Lisp",
            "${env:ProgramFiles(x86)}\Steel Bank Common Lisp"
          ) | Where-Object { Test-Path (Join-Path $_ 'sbcl.exe') } | Select-Object -First 1
          if (-not $sbclHome) {
            $found = Get-ChildItem -Path "$env:ProgramFiles", 'C:\ProgramData\chocolatey' `
              -Filter sbcl.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $sbclHome = $found.DirectoryName }
          }
          if (-not $sbclHome) { throw 'sbcl.exe not found after choco install sbcl' }
          Add-Content -Path $env:GITHUB_PATH -Value $sbclHome
          Add-Content -Path $env:GITHUB_ENV -Value "SBCL_HOME=$sbclHome"

      # dexador pulls in cl+ssl, which dlopens libssl/libcrypto when the
      # system is LOADED, not when a request is made — with no OpenSSL on
      # PATH the build dies at quickload, long before any code of ours runs.
      - name: Put OpenSSL on PATH
        shell: pwsh
        run: |
          # Look for the DLL, not the directory: an OpenSSL folder with
          # nothing cl+ssl recognises in it would let this step pass and the
          # build fail three steps later with a foreign-library error.
          function Find-LibSsl {
            @("C:\Program Files\OpenSSL\bin",
              "C:\Program Files\OpenSSL-Win64\bin") |
              Where-Object { Test-Path $_ } |
              Where-Object { Get-ChildItem -Path $_ -Filter 'libssl*.dll' -ErrorAction SilentlyContinue } |
              Select-Object -First 1
          }
          $dir = Find-LibSsl
          if (-not $dir) {
            choco install openssl --no-progress -y
            $dir = Find-LibSsl
          }
          if (-not $dir) { throw 'no OpenSSL libssl*.dll found; cl+ssl (via dexador) cannot load without it' }
          Write-Host "OpenSSL: $dir"
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Cache Quicklisp
        id: cache-quicklisp
        uses: actions/cache@v6
        with:
          path: |
            ~\quicklisp
            ~\AppData\Local\common-lisp
          key: quicklisp-${{ runner.os }}-sbcl-${{ hashFiles('evo.asd') }}
          restore-keys: |
            quicklisp-${{ runner.os }}-sbcl-

      # Same reasoning as the Unix job: gate on the filesystem, not on
      # cache-hit, because quicklisp-quickstart:install ERRORS on an
      # existing install and restore-keys can restore it without an exact
      # key match.
      - name: Bootstrap Quicklisp
        shell: pwsh
        run: |
          $setup = Join-Path $HOME 'quicklisp\setup.lisp'
          if (Test-Path $setup) {
            Write-Host "Quicklisp restored from cache; skipping install."
            exit 0
          }
          Invoke-WebRequest -Uri https://beta.quicklisp.org/quicklisp.lisp -OutFile $env:TEMP\quicklisp.lisp
          sbcl --non-interactive --load $env:TEMP\quicklisp.lisp --eval '(quicklisp-quickstart:install)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wire Quicklisp into the SBCL init file
        shell: pwsh
        run: |
          $init = Join-Path $HOME '.sbclrc'
          @'
          #-quicklisp
          (let ((quicklisp-init (merge-pathnames "quicklisp/setup.lisp"
                                                  (user-homedir-pathname))))
            (when (probe-file quicklisp-init)
              (load quicklisp-init)))
          '@ | Set-Content -Path $init -Encoding ASCII

      - name: Pre-fetch dependencies
        shell: pwsh
        run: |
          sbcl --non-interactive `
            --eval '(push (uiop:getcwd) asdf:*central-registry*)' `
            --eval '(ql:quickload :evo)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: .\make.ps1 build
        shell: pwsh
        run: .\make.ps1 build

      # The Lisp-portable unit suite, the same one the Unix job runs.  The
      # Windows-only live console-test is not here: it needs a real console.
      - name: .\make.ps1 test
        shell: pwsh
        run: .\make.ps1 test

      - name: .\make.ps1 install
        shell: pwsh
        run: .\make.ps1 install

      # The binary must at least start, parse argv and exit cleanly — a
      # build that produces an evo.exe which dies on startup is not a build.
      - name: evo.exe --version
        shell: pwsh
        run: |
          & (Join-Path $HOME '.evo\bin\evo.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
